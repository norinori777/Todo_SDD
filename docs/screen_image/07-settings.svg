<svg xmlns="http://www.w3.org/2000/svg" width="460" height="920" viewBox="0 0 460 920" role="img" aria-labelledby="title desc">
  <title id="title">設定画面</title>
  <desc id="desc">Markdownファイルの参照・保存先フォルダーを指定する設定画面。</desc>
  <rect width="460" height="920" rx="28" fill="#f3f5f9"/>
  <rect x="14" y="14" width="432" height="892" rx="24" fill="#ffffff" stroke="#dce3ee" stroke-width="2"/>
  <g font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
    <text x="38" y="49" font-size="13" fill="#58677e">9:41</text>
    <text x="414" y="49" text-anchor="end" font-size="13" fill="#58677e">●  ▰</text>
    <text x="38" y="102" font-size="26" fill="#52627b">‹</text>
    <text x="75" y="101" font-size="22" font-weight="700" fill="#17243a">設定</text>
    <text x="38" y="157" font-size="15" font-weight="700" fill="#354660">Markdownフォルダー</text>
    <text x="38" y="183" font-size="13" fill="#8290a3">Todoの参照・保存に使用するフォルダー</text>
    <text x="38" y="204" font-size="13" fill="#8290a3">を選択します。</text>
    <rect x="38" y="227" width="384" height="134" rx="18" fill="#ffffff" stroke="#dce4ef"/>
    <rect x="56" y="246" width="42" height="42" rx="12" fill="#eef0ff"/>
    <text x="77" y="273" text-anchor="middle" font-size="18" fill="#5969d8">▣</text>
    <text x="111" y="259" font-size="11" fill="#8a97aa">選択中のフォルダー</text>
    <text x="111" y="281" font-size="15" font-weight="700" fill="#25364f">Obsidian Vault</text>
    <line x1="56" y1="304" x2="404" y2="304" stroke="#edf0f5"/>
    <text x="56" y="339" font-size="14" font-weight="700" fill="#5364ce">フォルダーを変更</text>
    <text x="402" y="339" text-anchor="end" font-size="20" fill="#9ba8ba">›</text>
    <rect x="38" y="383" width="384" height="72" rx="14" fill="#f5f7fb"/>
    <text x="54" y="409" font-size="12" fill="#697990">選択したフォルダー内のMarkdownを</text>
    <text x="54" y="429" font-size="12" fill="#697990">Todoの参照・作成・更新に使用します。</text>
    <rect x="184" y="879" width="92" height="4" rx="2" fill="#c6ceda"/>
  </g>
</svg>
