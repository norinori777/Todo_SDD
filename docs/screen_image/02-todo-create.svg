<svg xmlns="http://www.w3.org/2000/svg" width="460" height="920" viewBox="0 0 460 920" role="img" aria-labelledby="title desc">
  <title id="title">Todo作成画面・タグ候補</title>
  <desc id="desc">必須のタイトル、Markdown本文、自動付与されるTODO見出しとタグ候補を示す。</desc>
  <rect width="460" height="920" rx="28" fill="#f3f5f9"/>
  <rect x="14" y="14" width="432" height="892" rx="24" fill="#ffffff" stroke="#dce3ee" stroke-width="2"/>
  <g font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
    <text x="38" y="49" font-size="13" fill="#58677e">9:41</text>
    <text x="414" y="49" text-anchor="end" font-size="13" fill="#58677e">●  ▰</text>
    <text x="38" y="102" font-size="26" fill="#52627b">‹</text>
    <text x="75" y="101" font-size="22" font-weight="700" fill="#17243a">Todoを作成</text>
    <text x="39" y="155" font-size="14" font-weight="700" fill="#34445d">タイトル <tspan fill="#d55c70">*</tspan></text>
    <rect x="38" y="168" width="384" height="55" rx="14" fill="#ffffff" stroke="#cdd7e6" stroke-width="1.5"/>
    <text x="54" y="202" font-size="15" fill="#25364f">企画書をまとめる</text>
    <text x="39" y="259" font-size="14" font-weight="700" fill="#34445d">内容 <tspan font-weight="400" fill="#93a0b1">（任意）</tspan></text>
    <rect x="38" y="273" width="384" height="46" rx="12" fill="#f0f3f8"/>
    <rect x="42" y="277" width="187" height="38" rx="9" fill="#ffffff"/>
    <text x="135" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#5364ce">入力</text>
    <text x="326" y="302" text-anchor="middle" font-size="14" fill="#7d8ba0">プレビュー</text>
    <rect x="38" y="329" width="384" height="331" rx="15" fill="#ffffff" stroke="#cdd7e6"/>
    <text x="55" y="361" font-size="14" fill="#354660"># TODO</text>
    <text x="55" y="394" font-size="14" fill="#354660">企画の方向性を整理する。</text>
    <text x="55" y="426" font-size="14" fill="#354660">#仕事</text>
    <line x1="105" y1="410" x2="105" y2="430" stroke="#5969d8" stroke-width="2"/>
    <rect x="54" y="443" width="300" height="135" rx="12" fill="#ffffff" stroke="#cdd7e6"/>
    <text x="70" y="468" font-size="11" fill="#8a97aa">登録済みタグの候補</text>
    <rect x="62" y="478" width="284" height="36" rx="8" fill="#f0f2ff"/>
    <text x="74" y="502" font-size="13" fill="#4e60c7">#仕事/企画</text>
    <text x="74" y="544" font-size="13" fill="#53647b">#仕事/会議</text>
    <text x="40" y="686" font-size="12" fill="#8290a3">#入力で候補を表示・部分一致で絞り込み</text>
    <text x="40" y="707" font-size="12" fill="#8290a3">候補がない場合、Enterで新しいタグを追加</text>
    <rect x="38" y="800" width="384" height="55" rx="16" fill="#5969d8"/>
    <text x="230" y="835" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">作成する</text>
    <rect x="184" y="879" width="92" height="4" rx="2" fill="#c6ceda"/>
  </g>
</svg>
